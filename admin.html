<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SISFAR — Central Administrativa</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="alternate icon" href="favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-main: #0f172a;
      --bg-card: #1e293b;
      --border-subtle: #334155;
      --text-primary: #f8fafc;
      --text-secondary: #94a3b8;
      --oficial-btn: #059669;
      --oficial-btn-hover: #10b981;
      --radius-md: 10px;
      --radius-lg: 14px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-main);
      color: var(--text-primary);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }
    .gate-card {
      background-color: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-lg);
      padding: 2.5rem 2rem;
      max-width: 520px;
      width: 100%;
      text-align: center;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.4);
    }
    .brand-mark {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 54px;
      height: 54px;
      border-radius: var(--radius-md);
      background: linear-gradient(135deg, #0284c7, #0369a1);
      color: #ffffff;
      margin-bottom: 1.25rem;
      box-shadow: 0 4px 12px rgba(2, 132, 199, 0.3);
    }
    .brand-mark svg { width: 30px; height: 30px; }
    h1 { font-size: 1.45rem; font-weight: 700; margin-bottom: 0.5rem; }
    p { color: var(--text-secondary); font-size: 0.9rem; line-height: 1.6; margin-bottom: 1.5rem; }
    .security-notice {
      background-color: rgba(2, 132, 199, 0.08);
      border: 1px solid rgba(2, 132, 199, 0.25);
      border-radius: var(--radius-md);
      padding: 1rem;
      margin-bottom: 1.75rem;
      text-align: left;
      font-size: 0.825rem;
      color: #bae6fd;
    }
    .security-notice strong { color: #38bdf8; }
    .btn-enter {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      width: 100%;
      padding: 0.85rem 1.25rem;
      background-color: var(--oficial-btn);
      color: #ffffff;
      font-weight: 600;
      font-size: 0.95rem;
      text-decoration: none;
      border-radius: var(--radius-md);
      transition: background-color 0.15s, transform 0.1s;
    }
    .btn-enter:hover { background-color: var(--oficial-btn-hover); transform: translateY(-1px); }
    .btn-back {
      display: inline-block;
      margin-top: 1.25rem;
      color: var(--text-secondary);
      text-decoration: none;
      font-size: 0.825rem;
      transition: color 0.15s;
    }
    .btn-back:hover { color: var(--text-primary); text-decoration: underline; }
  </style>
</head>
<body>
  <div class="gate-card">
    <div class="brand-mark">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
        <path d="M9 12h6"/>
        <path d="M12 9v6"/>
      </svg>
    </div>
    <h1>Central Administrativa de Links</h1>
    <p>Acesso restrito para gestão e atualização dos 6 ambientes oficiais e de homologação do SISFAR.</p>
    <div class="security-notice">
      <strong>Autenticação Obrigatória:</strong> A edição de links é protegida e exige acesso via conta Google autorizada.
    </div>
    <a href="https://script.google.com/macros/s/AKfycbzfFCnz1hjGBSPxywchGld8B4VLSFb5_TLCfQO76TloepFKhvGznXJJ-SgLzAn-HDm1CA/exec" class="btn-enter">
      <span>Acessar Painel Administrativo</span>
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
    </a>
    <div>
      <a href="index.html" class="btn-back">← Voltar ao Portal Público</a>
    </div>
  </div>
</body>
</html>
