<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SISFAR — Central Administrativa de Links</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="alternate icon" href="favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-main: #0f172a;
      --bg-surface: #1e293b;
      --bg-card: #1e293b;
      --border-subtle: #334155;
      --text-primary: #f8fafc;
      --text-secondary: #94a3b8;
      --text-muted: #64748b;
      
      --oficial-accent: #10b981;
      --oficial-bg: rgba(16, 185, 129, 0.08);
      --oficial-border: rgba(16, 185, 129, 0.25);
      --oficial-badge-bg: rgba(16, 185, 129, 0.15);
      --oficial-badge-text: #34d399;
      --oficial-btn: #059669;

      --audit-accent: #f59e0b;
      --audit-bg: rgba(245, 158, 11, 0.08);
      --audit-border: rgba(245, 158, 11, 0.25);
      --audit-badge-bg: rgba(245, 158, 11, 0.15);
      --audit-badge-text: #fbbf24;
      --audit-btn: #d97706;

      --radius-sm: 6px;
      --radius-md: 10px;
      --radius-lg: 14px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-main);
      color: var(--text-primary);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }

    .container {
      width: 100%;
      max-width: 1100px;
      margin: 0 auto;
      padding: 2rem 1.5rem 6rem;
      flex: 1;
    }

    /* Top Bar */
    .top-nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 1.5rem;
      margin-bottom: 2rem;
      border-bottom: 1px solid var(--border-subtle);
    }

    .brand-group {
      display: flex;
      align-items: center;
      gap: 1rem;
    }

    .brand-mark {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 42px;
      height: 42px;
      border-radius: var(--radius-md);
      background: linear-gradient(135deg, #0284c7, #0369a1);
      color: #ffffff;
      box-shadow: 0 4px 12px rgba(2, 132, 199, 0.3);
    }

    .brand-mark svg { width: 24px; height: 24px; }

    h1 { font-size: 1.4rem; font-weight: 700; color: var(--text-primary); }
    .subtitle { font-size: 0.875rem; color: var(--text-secondary); }

    .btn-secondary {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.6rem 1rem;
      background-color: var(--bg-surface);
      color: var(--text-primary);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-md);
      text-decoration: none;
      font-size: 0.875rem;
      font-weight: 500;
      transition: background-color 0.15s, border-color 0.15s;
    }

    .btn-secondary:hover {
      background-color: #334155;
      border-color: #475569;
    }

    /* Status Box */
    .status-box {
      background-color: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-md);
      padding: 1rem 1.25rem;
      margin-bottom: 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 1rem;
    }

    .status-indicator {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      font-size: 0.875rem;
    }

    .status-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background-color: #64748b;
    }

    .status-dot.online { background-color: #10b981; box-shadow: 0 0 8px rgba(16, 185, 129, 0.6); }
    .status-dot.syncing { background-color: #f59e0b; }
    .status-dot.error { background-color: #ef4444; }

    /* Section Styles */
    .section-title-wrap {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      margin-bottom: 1.25rem;
    }

    .section-pill {
      font-size: 0.75rem;
      text-transform: uppercase;
      font-weight: 700;
      letter-spacing: 0.05em;
      padding: 0.25rem 0.6rem;
      border-radius: 9999px;
    }

    .section-pill.oficial { background: var(--oficial-badge-bg); color: var(--oficial-badge-text); border: 1px solid var(--oficial-border); }
    .section-pill.audit { background: var(--audit-badge-bg); color: var(--audit-badge-text); border: 1px solid var(--audit-border); }

    .section-heading { font-size: 1.15rem; font-weight: 600; color: var(--text-primary); }

    .grid-forms {
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
      margin-bottom: 2.5rem;
    }

    /* Config Cards */
    .config-card {
      background-color: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-lg);
      padding: 1.25rem 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .config-card.oficial { border-left: 4px solid var(--oficial-accent); }
    .config-card.audit { border-left: 4px solid var(--audit-accent); }

    .card-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .card-title {
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--text-primary);
      display: flex;
      align-items: center;
      gap: 0.6rem;
    }

    .form-row {
      display: grid;
      grid-template-columns: 2fr 3fr 1fr 1fr;
      gap: 1rem;
      align-items: flex-end;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 0.35rem;
    }

    label {
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.03em;
      color: var(--text-secondary);
    }

    input[type="text"], input[type="url"], input[type="number"], select {
      background-color: #0f172a;
      border: 1px solid var(--border-subtle);
      color: var(--text-primary);
      padding: 0.65rem 0.85rem;
      border-radius: var(--radius-md);
      font-size: 0.875rem;
      font-family: inherit;
      width: 100%;
      outline: none;
      transition: border-color 0.15s;
    }

    input:focus, select:focus {
      border-color: #0284c7;
    }

    .btn-test {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.4rem;
      padding: 0.65rem 0.85rem;
      background-color: #334155;
      color: #f8fafc;
      border: none;
      border-radius: var(--radius-md);
      font-size: 0.8rem;
      font-weight: 600;
      text-decoration: none;
      cursor: pointer;
      transition: background-color 0.15s;
      white-space: nowrap;
    }

    .btn-test:hover { background-color: #475569; }

    /* Sticky Bottom Actions */
    .action-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background-color: rgba(15, 23, 42, 0.95);
      backdrop-filter: blur(8px);
      border-top: 1px solid var(--border-subtle);
      padding: 1rem 1.5rem;
      display: flex;
      justify-content: center;
      z-index: 100;
    }

    .action-bar-inner {
      width: 100%;
      max-width: 1100px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 1rem;
      flex-wrap: wrap;
    }

    .btn-primary {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.75rem 1.5rem;
      background-color: var(--oficial-btn);
      color: #ffffff;
      border: none;
      border-radius: var(--radius-md);
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.15s, transform 0.1s;
    }

    .btn-primary:hover { background-color: #10b981; transform: translateY(-1px); }
    .btn-primary:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }

    /* Toast Notification */
    #toast {
      position: fixed;
      bottom: 5rem;
      right: 2rem;
      padding: 1rem 1.5rem;
      border-radius: var(--radius-md);
      font-size: 0.875rem;
      font-weight: 500;
      display: none;
      box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3);
      z-index: 200;
      animation: slideUp 0.2s ease;
    }

    #toast.success { background-color: #065f46; color: #a7f3d0; border: 1px solid #059669; }
    #toast.error { background-color: #991b1b; color: #fecaca; border: 1px solid #dc2626; }
    #toast.info { background-color: #1e3a8a; color: #bfdbfe; border: 1px solid #2563eb; }

    @keyframes slideUp {
      from { transform: translateY(20px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }

    @media (max-width: 850px) {
      .form-row {
        grid-template-columns: 1fr;
      }
      .top-nav {
        flex-direction: column;
        align-items: flex-start;
        gap: 1rem;
      }
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="top-nav">
      <div class="brand-group">
        <div class="brand-mark">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
            <path d="M9 12h6"/>
            <path d="M12 9v6"/>
          </svg>
        </div>
        <div>
          <h1>Central Administrativa de Links</h1>
          <p class="subtitle">SISFAR — Sistema Integrado de Farmácia Prisional</p>
        </div>
      </div>
      <a href="index.html" class="btn-secondary">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
        <span>Voltar ao Portal</span>
      </a>
    </div>

    <!-- Status de Conexão -->
    <div class="status-box">
      <div class="status-indicator">
        <div id="statusDot" class="status-dot syncing"></div>
        <span id="statusText">Conectando ao backend de configuração...</span>
      </div>
      <div style="font-size: 0.8rem; color: var(--text-muted);" id="lastUpdatedText">
        Última sincronização: Carregando...
      </div>
    </div>

    <!-- Seção OFICIAL -->
    <section>
      <div class="section-title-wrap">
        <span class="section-pill oficial">Produção</span>
        <h2 class="section-heading">Ambientes Oficiais de Operação</h2>
      </div>

      <div class="grid-forms" id="groupOficial">
        <!-- Cards Oficiais injetados via JS -->
      </div>
    </section>

    <!-- Seção AUDIT -->
    <section style="margin-top: 2rem;">
      <div class="section-title-wrap">
        <span class="section-pill audit">Homologação</span>
        <h2 class="section-heading">Ambientes de Homologação / AUDIT Isolados</h2>
      </div>

      <div class="grid-forms" id="groupAudit">
        <!-- Cards AUDIT injetados via JS -->
      </div>
    </section>
  </div>

  <!-- Barra Fixa de Ações -->
  <div class="action-bar">
    <div class="action-bar-inner">
      <div style="display: flex; gap: 0.75rem;">
        <button type="button" id="btnReset" class="btn-secondary" style="font-size: 0.8rem;">
          Restaurar Padrões
        </button>
        <button type="button" id="btnReload" class="btn-secondary" style="font-size: 0.8rem;">
          Recarregar da Nuvem
        </button>
      </div>
      <button type="button" id="btnSave" class="btn-primary">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>
        <span>Salvar Todas as Alterações</span>
      </button>
    </div>
  </div>

  <div id="toast"></div>

  <script src="links.js"></script>
  <script>
    (function () {
      var currentConfig = null;
      var apiEndpoint = (typeof SISFAR_CONFIG !== 'undefined' && SISFAR_CONFIG.apiEndpoint) ? SISFAR_CONFIG.apiEndpoint : '';

      function showToast(msg, type) {
        var t = document.getElementById('toast');
        t.textContent = msg;
        t.className = type || 'info';
        t.style.display = 'block';
        setTimeout(function () { t.style.display = 'none'; }, 4000);
      }

      function updateStatus(state, msg, time) {
        var dot = document.getElementById('statusDot');
        var txt = document.getElementById('statusText');
        var last = document.getElementById('lastUpdatedText');
        dot.className = 'status-dot ' + state;
        txt.textContent = msg;
        if (time) {
          last.textContent = 'Última sincronização: ' + new Date(time).toLocaleString('pt-BR');
        }
      }

      function renderCards(ambientes) {
        var groupOficial = document.getElementById('groupOficial');
        var groupAudit = document.getElementById('groupAudit');
        groupOficial.innerHTML = '';
        groupAudit.innerHTML = '';

        var keys = Object.keys(ambientes).sort(function (a, b) {
          return (ambientes[a].ordem || 0) - (ambientes[b].ordem || 0);
        });

        keys.forEach(function (key) {
          var item = ambientes[key];
          var isOficial = item.tipo === 'oficial';
          var card = document.createElement('div');
          card.className = 'config-card ' + (isOficial ? 'oficial' : 'audit');

          card.innerHTML =
            '<div class="card-top">' +
              '<div class="card-title">' +
                '<span>' + (item.id.replace('Oficial', '').replace('Audit', '').toUpperCase()) + '</span>' +
                '<span class="section-pill ' + (isOficial ? 'oficial' : 'audit') + '">' + (isOficial ? 'Oficial' : 'AUDIT') + '</span>' +
              '</div>' +
              '<a href="' + item.url + '" target="_blank" rel="noopener noreferrer" class="btn-test">Testar Link ↗</a>' +
            '</div>' +
            '<div class="form-row">' +
              '<div class="form-group">' +
                '<label>Nome da Unidade / Ambiente</label>' +
                '<input type="text" id="name_' + key + '" value="' + (item.nome || '') + '">' +
              '</div>' +
              '<div class="form-group">' +
                '<label>URL do Web App (Google Apps Script)</label>' +
                '<input type="url" id="url_' + key + '" value="' + (item.url || '') + '">' +
              '</div>' +
              '<div class="form-group">' +
                '<label>Status</label>' +
                '<select id="status_' + key + '">' +
                  '<option value="true"' + (item.ativo !== false ? ' selected' : '') + '>Ativo</option>' +
                  '<option value="false"' + (item.ativo === false ? ' selected' : '') + '>Inativo</option>' +
                '</select>' +
              '</div>' +
              '<div class="form-group">' +
                '<label>Ordem</label>' +
                '<input type="number" id="order_' + key + '" value="' + (item.ordem || 1) + '" min="1" max="99">' +
              '</div>' +
            '</div>';

          if (isOficial) {
            groupOficial.appendChild(card);
          } else {
            groupAudit.appendChild(card);
          }
        });
      }

      function loadConfigFromCloud() {
        updateStatus('syncing', 'Buscando configuração na nuvem...');
        if (!apiEndpoint) {
          updateStatus('error', 'Endpoint de API não configurado.');
          if (typeof SISFAR_CONFIG !== 'undefined') {
            currentConfig = JSON.parse(JSON.stringify(SISFAR_CONFIG.ambientes));
            renderCards(currentConfig);
          }
          return;
        }

        fetch(apiEndpoint + '?action=get')
          .then(function (res) { return res.json(); })
          .then(function (data) {
            if (data.success && data.data) {
              currentConfig = data.data;
              renderCards(currentConfig);
              updateStatus('online', 'Conectado à nuvem (Google Apps Script)', data.updatedAt);
            } else {
              throw new Error(data.error || 'Falha ao processar dados da nuvem');
            }
          })
          .catch(function (err) {
            console.warn('Erro ao carregar do backend:', err);
            updateStatus('error', 'Modo Offline (Usando configuração local padrão)');
            if (typeof SISFAR_CONFIG !== 'undefined') {
              currentConfig = JSON.parse(JSON.stringify(SISFAR_CONFIG.ambientes));
              renderCards(currentConfig);
            }
          });
      }

      function collectFormData() {
        var payload = {};
        if (!currentConfig) return payload;

        for (var key in currentConfig) {
          if (Object.prototype.hasOwnProperty.call(currentConfig, key)) {
            var nameEl = document.getElementById('name_' + key);
            var urlEl = document.getElementById('url_' + key);
            var statusEl = document.getElementById('status_' + key);
            var orderEl = document.getElementById('order_' + key);

            payload[key] = {
              id: key,
              nome: nameEl ? nameEl.value.trim() : currentConfig[key].nome,
              tipo: currentConfig[key].tipo,
              url: urlEl ? urlEl.value.trim() : currentConfig[key].url,
              ativo: statusEl ? (statusEl.value === 'true') : true,
              ordem: orderEl ? parseInt(orderEl.value, 10) : currentConfig[key].ordem
            };
          }
        }
        return payload;
      }

      document.getElementById('btnSave').addEventListener('click', function () {
        var btn = document.getElementById('btnSave');
        btn.disabled = true;
        btn.innerHTML = '<span>Salvando...</span>';

        var updated = collectFormData();

        fetch(apiEndpoint, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify(updated)
        })
        .then(function (res) { return res.json(); })
        .then(function (data) {
          btn.disabled = false;
          btn.innerHTML = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg><span>Salvar Todas as Alterações</span>';
          if (data.success) {
            currentConfig = updated;
            showToast('✓ ' + (data.message || 'Configuração salva com sucesso!'), 'success');
            updateStatus('online', 'Conectado à nuvem (Google Apps Script)', data.updatedAt || new Date().toISOString());
          } else {
            showToast('Erro ao salvar: ' + (data.error || 'Erro desconhecido'), 'error');
          }
        })
        .catch(function (err) {
          btn.disabled = false;
          btn.innerHTML = '<span>Salvar Todas as Alterações</span>';
          showToast('Falha na comunicação: ' + err.message, 'error');
        });
      });

      document.getElementById('btnReset').addEventListener('click', function () {
        if (!confirm('Deseja realmente restaurar todos os 6 links para a configuração padrão original?')) return;
        fetch(apiEndpoint + '?action=reset')
          .then(function (r) { return r.json(); })
          .then(function (d) {
            if (d.success && d.data) {
              currentConfig = d.data;
              renderCards(currentConfig);
              showToast('Links restaurados para os padrões!', 'success');
            }
          })
          .catch(function (e) {
            showToast('Erro ao restaurar: ' + e.message, 'error');
          });
      });

      document.getElementById('btnReload').addEventListener('click', function () {
        loadConfigFromCloud();
      });

      // Inicialização
      loadConfigFromCloud();
    })();
  </script>
</body>
</html>
